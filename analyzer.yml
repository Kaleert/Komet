include: {}

filename: "meww-source.txt"
separator: "/* %path% */"
skipBinary: true
encoding: "utf-8"

# Настройки разделения
splitIntoParts: 1
# maxTokensPerPart: 32000  # Максимум 32000 токенов на часть

# Максимальный размер файла в МБ (0 = без ограничений)
maxFileSize: 1

# Фильтрация по расширениям (пустой список = все расширения)
includeExtensions: {}
excludeExtensions: {}

# Настройки анализа
countEmptyLines: true
showFileStats: true
addTimestamp: true
addHeader: true
lineEndings: "unix"  # preserve, unix, windows
verbose: true

# Новые настройки для анализа кода
scanTodos: true
minCommentLength: 10
showTodosInStats: true
analyzeCodeQuality: true
complexityThreshold: 150
outputFormat: "text"

analyzeComplexity: true
findHotspots: true
techDebtAnalysis: true
